<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>404 · Joshua 数字生命</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0B1E3F; color: #E5E9F0; font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    text-align: center; padding: 24px;
  }
  .box { max-width: 420px; }
  .code { font-size: clamp(64px, 14vw, 96px); font-weight: 900; color: #22D3EE; letter-spacing: 0.04em; }
  .title { margin-top: 12px; font-size: 22px; font-weight: 700; }
  .desc { margin-top: 12px; font-size: 15px; line-height: 1.8; color: #9FB0C8; }
  .btn { display: inline-flex; margin-top: 28px; height: 48px; padding: 0 26px; border-radius: 12px;
    align-items: center; text-decoration: none; background: #22D3EE; color: #0B1E3F; font-weight: 600; font-size: 16px; }
</style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <div class="title">页面不在这片数据域里</div>
    <p class="desc">你访问的页面已被移动或不存在，回到首页继续浏览。</p>
    <a class="btn" href="/">返回首页</a>
  </div>
</body>
</html>
